description: >
  The working code behind the transaction fraud detection methodology paper:
  the shared DataPreProcessing notebook (column selection, categorical
  encoding, the train test split, and feature scaling) that every classifier
  notebook imports from, an exploratory data analysis notebook, and all four
  trained classifiers, Decision Tree, K Nearest Neighbors, Logistic
  Regression, and Random Forest, each with training, an overfitting check, a
  classification report, ROC and precision recall curves, a confusion matrix,
  and a calibration curve. Random Forest is the paper's recommended model for
  deployment.
