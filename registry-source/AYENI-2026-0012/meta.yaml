description: >
  The methodology paper behind provider level claims anomaly detection: a
  supervised learning study comparing Random Forest, Support Vector Machine,
  and K Nearest Neighbors classifiers on structured Medicare style claims
  data, at a fraud prevalence of about 9 percent. The best configuration, a
  Random Forest with a depth of 25 and 1,000 estimators, reached 86.88 percent
  accuracy, an F1 score of 0.819, and an AUC ROC of 0.94. Covers the feature
  engineering behind that result, including chronic condition indexing and
  derived survival status, and examines the regulatory framework a detector
  operates inside: the False Claims Act, the Anti Kickback Statute, the Stark
  Law, and HIPAA.
