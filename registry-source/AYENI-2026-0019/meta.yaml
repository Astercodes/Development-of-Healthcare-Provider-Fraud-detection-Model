description: >
  An expanded methodology paper behind provider level claims anomaly
  detection: a supervised learning study comparing Random Forest, Support
  Vector Machine, and K Nearest Neighbors classifiers on structured Medicare
  claims data, at a fraud prevalence of about 9 percent. The best
  configuration, a Random Forest with a depth of 25 and 1,000 estimators,
  reached 86.88 percent accuracy, an F1 score of 0.8187, and an AUC ROC of
  0.94. This version presents the full study as a complete paper: end to end
  data preprocessing, clinically informed feature engineering including
  chronic condition indexing and derived survival status, deployment
  considerations for a programme integrity unit, and the regulatory framework
  a detector operates inside, the False Claims Act, the Anti Kickback Statute,
  the Stark Law, and HIPAA.
