description: >
  Everything a volunteer needs to deliver Module 03 competently: a timed
  delivery script broken into four fixed parts across 45 minutes, guidance on
  running the live in session codeword exercise, which is the longest single
  block and the first thing a nervous facilitator cuts, guidance on the thirty
  seconds after a participant discloses a version of this happened to their
  family, and a note that a facilitator does not need to be able to explain
  how voice cloning software works, only to run the session's fixed structure
  honestly.
