description: >
  Everything a volunteer needs to deliver Module 01 competently: a timed
  delivery script broken into five-to-twelve-minute segments, a 30-minute cut
  version, a specimen credit-file exercise with an answer key and teaching
  rationale for each line, guidance on the thirty seconds after a participant
  discloses it happened to them, room-management guidance, a list of things
  never to say and why, and a printable session-record form.
