identifier: AYENI-2026-0011
title: Feature dictionary: provider level fraud detection for federal healthcare programmes
initiative: 1
type: specification
tier: 1
licence: CC BY 4.0
published: 2026-05-30
version: 1
description: >
  The complete specification of the feature space behind the provider level
  healthcare claims anomaly detection work: 29 entries covering identifiers,
  demographics, coverage, clinical indicators, financial fields, and
  engineered measurements, of which 19 are implemented in the published
  reference model and 10 specify a not yet implemented provider level
  aggregation layer. Documents the exact, order dependent computation for
  every engineered feature, an unresolved chronic condition coding ambiguity
  that can silently invert the health burden index, and the fairness
  restrictions that exclude race from any deployed scoring model.
